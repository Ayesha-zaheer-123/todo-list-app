<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Document</title> 
    <style> 
       *{ 
        margin:0; 
        padding:0; 
       } 
       body{ 
        background-color:#F1DABF; 
        color:white; 
       } 
       h1{ 
        color:#92817A; 
        text-align:center; 
       } 
       .main-container{ 
        height:600px; 
        width:300px; 
        background-color:#FFFBFF ; 
        margin:auto; 
        border-radius:50px; 
        border:2px solid white; 
        text-align:center; 
        overflow:auto; 
border:2px solid #a8a19d; 
box-shadow:2px #92817A; 
       } 
       .buttons{ 
   width:100%; 
    display:flex; 
    justify-content: space-between; 
       } 
       .tasks{ 
        height:70px; 
        width:30%; 
        margin-top:5px; 
        padding:3px; 
        border-radius:17px; 
        color: #5a4a42;  
       } 
       #total{ 
        background-color:#E8C9A8; 
        margin-left:2px; 
        color: #8a6a45; 
       } 
       #completed{ 
background-color:#C8D9B8; 
color:#4a6a3a; 
       } 
       #pending{ 
        background-color: #D9B8C8; 
        color:#8a4a65;  
       } 
       #msg{ 
        margin-top:5px; 
       } 
       #msg2{ 
        margin-top:5px; 
       } 
       #msg3{ 
        padding:5px; 
       } 
       h2 { 
  color: #92817A; 
  margin-top: 15px; 
} 
.task { 
  display: flex; 
  justify-content: space-between; 
  align-items: center; 
  background-color:#f5ece0 ;   /* light cream, container se match karta hua */ 
  padding:10px; 
  margin-bottom: 8px; 
  border-radius: 12px; 
} 
.task-buttons{ 
    display:flex; 
    justify-content: center; 
    flex-shrink:0; 
    gap:8px; 
} 
.complete-btn, .delete-btn { 
height:35px; 
width:70px; 
font-size:13px; 
border:none; 
border-radius:25px; 
cursor:pointer; 
} 
.complete-btn { 
  background-color: #C8D9B8;    
  color: #3a4a2a; 
} 
 
.delete-btn { 
  background-color: #E8B8B8;    
  color: #5a2a2a; 
} 
 .task p { 
  color: #5a4a42; 
} 
.new-btn{ 
     background-color: #B8916B; 
    color:white; 
    border:none; 
    border-radius:30px; 
    font-size:19px; 
    padding:20px; 
    margin-top:20px; 
    cursor:pointer; 
} 
    </style> 
</head> 
<body> 
    <h1>To do app</h1> 
    <div class="main-container"> 
            <div class="buttons"> 
            <div class="tasks" id="total"> 
                <p>Total tasks</p> 
                <p id="msg">2</p> 
            </div> 
            <div class="tasks"id="completed"> 
                <p>Completed</p> 
                <p id="msg2">0</p> 
            </div> 
            <div class="tasks" id="pending"> 
                <p>Pending</p> 
                <p id="msg3">2</p> 
            </div> 
             </div> 
<h2>Your tasks:</h2> 
<div class="tasklist"> 
    <div class="task"> 
        <p>Groceries</p> 
        <div class="task-buttons"> 
 
<button class="complete-btn">Mark as Completed</button> 
         <button class="delete-btn">delete task</button> 
        </div> 
    </div> 
    <div class="task"> 
        <p>Complete Js project</p> 
        <div class="task-buttons"> 
 
<button class="complete-btn">Mark as Completed</button> 
         <button class="delete-btn">delete task</button> 
        </div> 
    </div> 
</div> 
<button class="new-btn">Add a new task </button> 
    </div> 
    <script> 
        let total=2; 
        let completed=0; 
        let totalbtn=document.querySelector("#msg"); 
        let completedbtn=document.querySelector("#msg2"); 
        let pendingbtn=document.querySelector("#msg3"); 
        let pending=2; 
        let newbtn=document.querySelector(".new-btn"); 
        let tasklist=document.querySelector(".tasklist"); 
        newbtn.addEventListener("click",()=>{ 
            let text=prompt("enter your text"); 
            if(text) { 
              let div = document.createElement("div"); 
              let p=document.createElement("p"); 
              p.innerText=text; 
              div.setAttribute("class","task"); 
              div.append(p); 
 
    let completeBtn = document.createElement("button"); 
    completeBtn.innerText = "Mark as Completed"; 
    completeBtn.className = "complete-btn"; 
     
    let deleteBtn = document.createElement("button"); 
    deleteBtn.innerText = "delete task"; 
    deleteBtn.className = "delete-btn"; 
     
    // buttons ke liye wrapper div 
    let btnWrapper = document.createElement("div"); 
    btnWrapper.className = "task-buttons"; 
    btnWrapper.append(completeBtn); 
    btnWrapper.append(deleteBtn); 
     
    div.append(btnWrapper);  // wrapper ko bhi task div mein daalo 
     
    tasklist.append(div);    // poora naya task, tasklist mein add karo 
     
    total += 1; 
    pending += 1; 
    totalbtn.innerText=total; 
    pendingbtn.innerText=pending; 
  } 
        }); 
        tasklist.addEventListener("click",(event)=>{ 
if(event.target.classList.contains("complete-btn")) { 
   let btn=event.target; 
   let taskdiv=btn.parentElement.parentElement; 
   let p=taskdiv.querySelector("p"); 
   btn.style.backgroundColor="green"; 
   btn.innerText="Completed"; 
   btn.disabled=true; 
   p.style.textDecoration="line-through"; 
   if(pending>0) { 
 pending-=1; 
   }else{ 
    pending=0; 
   } 
    completed+=1; 
    pendingbtn.innerText=pending; 
completedbtn.innerText=completed; 
} if(event.target.classList.contains("delete-btn")) { 
    let btn=event.target; 
    let taskdiv=btn.parentElement.parentElement; 
     let completeBtnInTask = btn.parentElement.querySelector(".complete-btn"); 
     if(completeBtnInTask.innerText==="Completed") { 
        completed-=1; 
        completedbtn.innerText = completed;  
     }else { 
    pending -= 1; 
    pendingbtn.innerText = pending; 
  } 
   
  total -= 1; 
  totalbtn.innerText = total; 
   
  taskdiv.remove(); 
} 
        }); 
    </script> 
 
</body> 
</html>
